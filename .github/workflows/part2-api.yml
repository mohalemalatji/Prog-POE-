name: Part 2 API CI

on:
  push:
    branches: [ main, part-2 ]
  pull_request:
    branches: [ main, part-2 ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore tests/RaceDay.Api.Tests/RaceDay.Api.Tests.csproj --configfile NuGet.Config
      - name: Build
        run: dotnet build tests/RaceDay.Api.Tests/RaceDay.Api.Tests.csproj --configuration Release --no-restore
      - name: Test
        run: dotnet test tests/RaceDay.Api.Tests/RaceDay.Api.Tests.csproj --configuration Release --no-build --logger "trx;LogFileName=results.trx"
